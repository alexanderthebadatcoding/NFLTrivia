<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blind Draft Challenge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draft a fantasy football team blind, then reveal the stats after you lock in."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blind Draft Challenge" />
    <meta
      name="twitter:description"
      content="Draft a fantasy football team blind, then reveal the stats after you lock in."
    />
    <meta
      name="twitter:image"
      content="https://trivia.scoreb.site/og-image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --turf: #16302a;
        --turf-dark: #0d211c;
        --chalk: #f0ecdf;
        --line: #cfc8b0;
        --gold: #d1a13f;
        --gold-bright: #e8bc5c;
        --ink: #16211d;
        --danger: #a8452f;
        --good: #3f7a52;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--turf);
        background-image: repeating-linear-gradient(
          90deg,
          rgba(240, 236, 223, 0.035) 0 2px,
          transparent 2px 78px
        );
        color: var(--chalk);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        padding-bottom: 60px;
      }
      header {
        padding: 26px 20px 20px;
        border-bottom: 3px solid var(--gold);
        text-align: center;
      }
      header h1 {
        font-family: "Anton", sans-serif;
        font-size: clamp(24px, 5.5vw, 40px);
        letter-spacing: 1px;
        margin: 0 0 4px;
        text-shadow: 3px 3px 0 var(--turf-dark);
      }
      header .twist-name {
        font-family: "Space Mono", monospace;
        color: var(--gold-bright);
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .rules {
        max-width: 700px;
        margin: 14px auto 0;
        background: rgba(240, 236, 223, 0.06);
        border: 1px solid rgba(240, 236, 223, 0.25);
        border-radius: 4px;
        padding: 12px 16px;
        font-size: 13px;
        text-align: left;
        line-height: 1.55;
      }
      .rules b {
        color: var(--gold-bright);
      }
      .blind-note {
        max-width: 700px;
        margin: 10px auto 0;
        font-family: "Space Mono", monospace;
        font-size: 12px;
        color: var(--gold-bright);
        text-align: center;
      }

      .scoreboard {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--turf-dark);
        border-bottom: 2px solid var(--gold);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 22px;
        font-family: "Space Mono", monospace;
      }
      .scoreboard .picks {
        font-size: 13px;
        color: var(--line);
      }
      .scoreboard button.reroll {
        background: none;
        border: 1px solid var(--gold);
        color: var(--gold-bright);
        font-family: "Space Mono", monospace;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
      }
      .scoreboard button.reroll:hover {
        background: var(--gold);
        color: var(--turf-dark);
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 26px 16px;
      }
      .slot {
        margin-bottom: 28px;
      }
      .slot-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(240, 236, 223, 0.25);
        padding-bottom: 6px;
      }
      .slot-head .tag {
        font-family: "Anton", sans-serif;
        font-size: 20px;
        color: var(--gold-bright);
      }
      .slot-head .need {
        font-family: "Space Mono", monospace;
        font-size: 12px;
        color: var(--line);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
      }
      .card {
        background: var(--chalk);
        color: var(--ink);
        border-radius: 3px;
        border: 2px solid transparent;
        padding: 14px 14px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
        position: relative;
        text-align: center;
      }
      @media (min-width: 601px) {
        .card {
          padding: 20px 18px;
        }
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      }
      .card.picked {
        border-color: var(--gold);
        background: #fbf3e0;
        box-shadow: 0 4px 0 var(--turf-dark);
      }
      .card.disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .card .name {
        font-weight: 700;
        font-size: 16px;
      }
      .card .team {
        font-family: "Space Mono", monospace;
        font-size: 11px;
        color: #6b6252;
        margin-top: 4px;
      }
      .card .revealed-stats {
        display: none;
        font-family: "Space Mono", monospace;
        font-size: 11px;
        color: var(--ink);
        margin-top: 8px;
        line-height: 1.6;
        text-align: left;
      }
      .card .pts {
        display: none;
        position: absolute;
        top: 8px;
        right: 10px;
        font-family: "Anton", sans-serif;
        font-size: 13px;
        color: var(--danger);
      }
      .card .best-badge {
        display: none;
        position: absolute;
        top: 6px;
        left: 6px;
        background: var(--good);
        border-radius: 3px;
        padding: 3px 5px;
        font-family: "Space Mono", monospace;
        font-size: 8px;
        color: #ffffff;
        font-weight: 700;
        line-height: 1.2;
      }
      body.revealed .card .revealed-stats {
        display: block;
      }
      body.revealed .card .pts {
        display: block;
      }
      body.revealed .card.best {
        border-color: var(--good);
        box-shadow: 0 4px 0 var(--good);
      }
      body.revealed .card.best .best-badge {
        display: block;
      }

      .draft-btn {
        display: block;
        margin: 30px auto 0;
        font-family: "Anton", sans-serif;
        font-size: 20px;
        letter-spacing: 1px;
        background: var(--gold);
        color: var(--turf-dark);
        border: none;
        padding: 14px 34px;
        border-radius: 3px;
        cursor: pointer;
      }
      .draft-btn:disabled {
        background: #6b6252;
        color: #ccc;
        cursor: not-allowed;
      }
      .draft-btn:not(:disabled):hover {
        background: var(--gold-bright);
      }

      .result {
        max-width: 720px;
        margin: 20px auto 0;
        background: var(--turf-dark);
        border: 2px solid var(--gold);
        border-radius: 4px;
        padding: 22px 24px;
        text-align: center;
        display: none;
      }
      .result.show {
        display: block;
      }
      .result .grade {
        font-family: "Anton", sans-serif;
        font-size: 60px;
        color: var(--gold-bright);
        line-height: 1;
      }
      .result .line {
        font-family: "Space Mono", monospace;
        font-size: 13px;
        color: var(--line);
        margin-top: 10px;
      }
      .result .verdict {
        margin-top: 12px;
        font-size: 15px;
        color: var(--chalk);
      }
      .result button.reroll2 {
        margin-top: 18px;
        background: var(--gold);
        border: none;
        color: var(--turf-dark);
        font-family: "Anton", sans-serif;
        font-size: 15px;
        padding: 10px 22px;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>

      };

      // ---------- Live ESPN leaders twist ----------
      const CATEGORIES = [
        { key: "passingYards", label: "Passing Yards", unit: "yds" },
        { key: "passingTouchdowns", label: "Passing Touchdowns", unit: "TD" },
        { key: "rushingYards", label: "Rushing Yards", unit: "yds" },
        { key: "rushingTouchdowns", label: "Rushing Touchdowns", unit: "TD" },
        { key: "receivingYards", label: "Receiving Yards", unit: "yds" },
        { key: "receptions", label: "Receptions", unit: "rec" },
        { key: "sacks", label: "Sacks", unit: "sacks" },
        { key: "interceptions", label: "Interceptions", unit: "INT" },
        { key: "totalTackles", label: "Total Tackles", unit: "tkl" },
      ];

      function leadersUrl(year) {
        return (
          "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/" +
          year +
          "/types/2/leaders?lang=en"
        );
      }

      const CURRENT_YEAR = 2025;
      const EARLIEST_YEAR = 1986;
      const YEARS = Array.from(
        { length: CURRENT_YEAR - EARLIEST_YEAR + 1 },
        (_, i) => CURRENT_YEAR - i,
      );
      const POOL_SIZE = 25; // how many top leaders are eligible to be dealt into a round
      const DEAL_SIZE = 6; // how many players are dealt as blind pick options per position
      const OPTIONS_PER_POSITION = 6;
      const MIN_CATEGORIES = 3; // a leaders twist needs at least this many usable categories to be worth playing
      const MAX_YEAR_ATTEMPTS = 6; // how many different seasons to try before giving up on a live twist
      const LIVE_TWIST_MARKER = { key: "live_espn_leaders", live: true };

      function toHttps(url) {
        return url.replace(/^http:\/\//, "https://");
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Older seasons don't carry every stat category ESPN tracks today (e.g. sacks
      // weren't an official stat until 1982), so a category only counts as usable
      // if the season actually returned a populated leaderboard for it.
      function usableCategories(catByName) {
        return CATEGORIES.filter((cat) => {
          const espnCat = catByName[cat.key];
          return (
            espnCat &&
            Array.isArray(espnCat.leaders) &&
            espnCat.leaders.length > 0
          );
        });
      }

      async function fetchLeadersForYear(year) {
        const res = await fetch(leadersUrl(year));
        if (!res.ok)
          throw new Error("ESPN leaders request failed: " + res.status);
        const data = await res.json();
        const catByName = {};
        (data.categories || []).forEach((c) => {
          catByName[c.name] = c;
        });
        return catByName;
      }

      async function buildLiveTwist() {
        const triedYears = new Set();
        let lastError = null;

        for (let attempt = 0; attempt < MAX_YEAR_ATTEMPTS; attempt++) {
          const remainingYears = YEARS.filter((y) => !triedYears.has(y));
          if (remainingYears.length === 0) break;
          const year =
            remainingYears[Math.floor(Math.random() * remainingYears.length)];
          triedYears.add(year);

          try {
            const catByName = await fetchLeadersForYear(year);
            const usableCats = usableCategories(catByName);
            if (usableCats.length < MIN_CATEGORIES) {
              lastError = new Error(
                `${year} only returned ${usableCats.length} usable categories`,
              );
              continue;
            }

            const idFromRef = (ref, resource) => {
              const m = ref && ref.match(new RegExp(`/${resource}/(\\d+)\\?`));
              return m ? Number(m[1]) : null;
            };

            const need = {};
            const players = {};
            const yy = String(year).slice(-2);

            for (const cat of usableCats) {
              need[cat.key] = 1;
              const espnCat = catByName[cat.key];
              const pool = espnCat.leaders.slice(0, POOL_SIZE);
              const dealt = shuffle(
                pool.map((leader, i) => ({ leader, rank: i + 1 })),
              ).slice(0, Math.min(DEAL_SIZE, pool.length));

              players[cat.key] = await Promise.all(
                dealt.map(async ({ leader, rank }) => {
                  let name = "Unknown Player";
                  let team = "NFL '" + yy;
                  let position = "";
                  try {
                    const aRes = await fetch(toHttps(leader.athlete.$ref));
                    if (aRes.ok) {
                      const aData = await aRes.json();
                      name = aData.displayName || aData.fullName || name;
                      position =
                        (aData.position && aData.position.abbreviation) || "";
                      const teamRef = aData.team && aData.team.$ref;
                      const teamId = idFromRef(teamRef, "teams");
                      const teamInfo = teamId !== null ? TEAMS[teamId] : null;
                      if (teamRef) {
                        const tRes = await fetch(toHttps(teamRef));
                        if (tRes.ok) {
                          const tData = await tRes.json();
                          const teamName = tData.displayName || tData.name;
                          const teamAbbr =
                            tData.abbreviation || (teamInfo && teamInfo.abbr);
                          if (teamName || teamAbbr) {
                            team = `${teamName || teamAbbr || "NFL"} '${yy}`;
                          }
                        }
                      }
                      if (team === "NFL '" + yy && teamInfo) {
                        team = `${teamInfo.name} '${yy}`;
                      }
                    }
                  } catch (e) {
                    /* keep fallback name */
                  }
                  return {
                    name,
                    position,
                    team,
                    stats: {
                      displayValue: leader.displayValue,
                      unit: cat.unit,
                      rank,
                    },
                  };
                }),
              );
            }

            const twist = {
              key: "live_" + year,
              name: `${year} Season Leaders`,
              live: true,
              need,
              lineupDesc: usableCats.map((c) => `1 ${c.label}`).join(" · "),
              rule: `Pulled straight from ESPN's live <b>${year}</b> season leaderboards. For each category, one of the real top ${POOL_SIZE} leaders is dealt in — you're picking blind on reputation alone.${usableCats.length < CATEGORIES.length ? ` (${CATEGORIES.length - usableCats.length} categor${CATEGORIES.length - usableCats.length === 1 ? "y wasn't" : "ies weren't"} tracked yet in ${year}, so they're sitting out this round.)` : ""}`,
              scoringNote: `Scoring (revealed after lock-in): each pick scores by its actual ESPN leaderboard rank — #1 of ${POOL_SIZE} = ${POOL_SIZE} pts, down to 1 pt for #${POOL_SIZE}.`,
              players,
            };

            if (!twistIsValid(twist)) {
              lastError = new Error(
                `${year} twist failed post-build validation`,
              );
              continue;
            }

            return twist;
          } catch (err) {
            lastError = err;
            continue;
          }
        }

        throw (
          lastError ||
          new Error(
            "Could not build a valid live twist for any attempted season.",
          )
        );
      }

      function rosterPositionPools(players) {
        const qb = Array.isArray(players.QB) ? players.QB : [];
        const rb = Array.isArray(players.RB) ? players.RB : [];
        const wr = Array.isArray(players.WR) ? players.WR : [];
        const te = Array.isArray(players.TE) ? players.TE : [];

        return {
          QB: qb,
          RB: rb.slice(0, OPTIONS_PER_POSITION),
          WR: wr.slice(0, OPTIONS_PER_POSITION),
          FLEX: [
            ...rb
              .slice(OPTIONS_PER_POSITION)
              .map((player) => ({ ...player, position: "RB" })),
            ...wr
              .slice(OPTIONS_PER_POSITION)
              .map((player) => ({ ...player, position: "WR" })),
            ...te.map((player) => ({ ...player, position: "TE" })),
          ],
        };

      function buildRosterTwist({ key, name, rule, players, sourceLabel }) {
        const rbCount = Array.isArray(players.RB) ? players.RB.length : 0;
        const wrCount = Array.isArray(players.WR) ? players.WR.length : 0;
        const skillNeed = rbCount <= 2 || wrCount <= 2 ? 1 : 2;
        const requestedNeed = {
          QB: 1,
          RB: skillNeed,
          WR: skillNeed,
          FLEX: 1,
        };
        const need = {};
        const positionPools = rosterPositionPools(players);

        Object.entries(requestedNeed).forEach(([position, amount]) => {
          const available = positionPools[position].length;
          if (available > 0) need[position] = Math.min(amount, available);
        });

        const lineupDesc = Object.entries(need)
          .map(([position, amount]) => `${amount} ${position}`)
          .join(" · ");

        return {
          key,
          name,
          rule: `${rule}${sourceLabel ? ` (${sourceLabel})` : ""}`,
          need,
          lineupDesc,
          scoringNote: DEFAULT_SCORING_NOTE,
          players: positionPools,
        };
      }

      function scoreOf(s) {

      function twistIsValid(t) {
        if (!t || !t.players || !t.need) return false;
        for (const pos of Object.keys(t.need)) {

          }
        }
        return true;
      }
      function statLine(s) {
        if (s.rank !== undefined)
          return `${s.displayValue} ${s.unit} · ESPN rank #${s.rank} of ${POOL_SIZE}`;
        const parts = [];
        if (s.yds !== undefined)
          parts.push(`${s.yds} pass yds`, `${s.td} TD`, `${s.int} INT`);
        if (s.ryds !== undefined)
          parts.push(`${s.ryds} rush yds`, `${s.rtd} rush TD`);
        if (s.recyds !== undefined)
          parts.push(
            `${s.recyds} rec yds`,
            `${s.rectd} rec TD`,
            `${s.rec} rec`,
          );
        return parts.join(" · ");
      }

      function slotLabel(pos) {
        if (!twist.live) return pos;
        const cat = CATEGORIES.find((c) => c.key === pos);
        return cat ? cat.label : pos;
      }

      function twistFamily(candidate) {
        if (candidate.live) return "live";
        if (candidate.key.startsWith("team_")) return "team";
        if (candidate.key.startsWith("division_")) return "division";
        if (candidate.key.startsWith("college_")) return "college";
        if (candidate.key.startsWith("rookies_")) return "rookies";
        if (candidate.key.endsWith("Stats")) return "year_stats";
        return "historical";
      }

      async function startNewTwist() {
        if (loadingTwist) return;
        loadingTwist = true;
        document.body.classList.remove("revealed");
        document.getElementById("twistName").textContent = "loading twist...";
        document.getElementById("rulesBox").innerHTML = "";
        document.getElementById("slotsContainer").innerHTML = "";
        document.getElementById("rerollTop").disabled = true;

        const availableTwists = TWISTS.filter((candidate) =>
          candidate.live ? !lastTwistWasLive : candidate.key !== lastTwistKey,
        );
        const differentFamilyTwists = availableTwists.filter(
          (candidate) => twistFamily(candidate) !== lastTwistFamily,
        );
        const familyPool =
          differentFamilyTwists.length > 0
            ? differentFamilyTwists
            : availableTwists.length > 0
              ? availableTwists
              : TWISTS;
        const families = [
          ...new Set(familyPool.map((candidate) => twistFamily(candidate))),
        ];
        const chosenFamily =
          families[Math.floor(Math.random() * families.length)];
        const chosenPool = familyPool.filter(
          (candidate) => twistFamily(candidate) === chosenFamily,
        );
        const chosen =
          chosenPool[Math.floor(Math.random() * chosenPool.length)];
        if (chosen.live) {
          try {
            twist = await buildLiveTwist();
          } catch (err) {
            console.error(
              "Live ESPN twist failed, falling back to a historical twist:",
              err,
            );
            const fallback = TWISTS.filter(
              (t) => !t.live && t.key !== lastTwistKey,
            );
            twist = fallback[Math.floor(Math.random() * fallback.length)];
          }
        } else {
          twist = chosen;
        }
        if (!twist.need) {
          twist.need = DEFAULT_NEED;
          twist.lineupDesc = DEFAULT_LINEUP_DESC;
        }

        // Randomize the order players are dealt in for every slot, every twist
        Object.keys(twist.players).forEach((pos) => {
          twist.players[pos] = shuffle(twist.players[pos]).slice(
            0,
            OPTIONS_PER_POSITION,
          );
        });

        // Final compatibility check: if anything about this twist (live or historical)
        // isn't actually playable, fall back to a known-good historical twist rather
        // than showing the user a broken board.
        if (!twistIsValid(twist)) {
          console.error(
            "Twist failed compatibility check, falling back to a historical twist:",
            twist && twist.key,
          );
          const fallback = TWISTS.filter(
            (t) => !t.live && t.key !== lastTwistKey,
          );
          twist = fallback[Math.floor(Math.random() * fallback.length)];
          Object.keys(twist.players).forEach((pos) => {
            twist.players[pos] = shuffle(twist.players[pos]);
          });
        }

        lastTwistKey = twist.key;
        lastTwistWasLive = !!twist.live;
        lastTwistFamily = twistFamily(twist);

        picked = {};
        Object.keys(twist.need).forEach((pos) => {
          picked[pos] = [];
        });

        document.getElementById("rerollTop").disabled = false;
        document.getElementById("twistName").textContent =
          "TWIST: " + twist.name;
        const totalNeeded = Object.values(twist.need).reduce(
          (a, b) => a + b,
          0,
        );
        document.getElementById("rulesBox").innerHTML =
          `<b>THE TWIST:</b> ${twist.rule} Build a ${totalNeeded}-pick lineup: <b>${twist.lineupDesc}</b>, picking blind. ${twist.scoringNote || DEFAULT_SCORING_NOTE}`;
        const container = document.getElementById("slotsContainer");
        container.innerHTML = "";
        Object.keys(twist.need).forEach((pos) => {
          const slotDiv = document.createElement("div");
          slotDiv.className = "slot";
          slotDiv.dataset.slot = pos;
          slotDiv.innerHTML = `<div class="slot-head"><span class="tag">${slotLabel(pos)}</span><span class="need">pick ${twist.need[pos]}</span></div><div class="cards"></div>`;
          container.appendChild(slotDiv);
        });
        const btn = document.createElement("button");
        btn.className = "draft-btn";
        btn.id = "lockBtn";
        btn.textContent = "LOCK IN LINEUP";
        btn.disabled = true;
        container.appendChild(btn);

        const resultDiv = document.createElement("div");
        resultDiv.className = "result";
        resultDiv.id = "result";
        resultDiv.innerHTML = `<div class="grade" id="gradeText">-</div><div class="line" id="scoreLine"></div><div class="verdict" id="verdictText"></div><button class="reroll2" id="rerollBottom">🔀 TRY A NEW TWIST</button>`;
        container.appendChild(resultDiv);

        btn.onclick = lockIn;
        document.getElementById("rerollBottom").onclick = startNewTwist;

        loadingTwist = false;
        render();
      }

      function render() {
        document.querySelectorAll(".slot").forEach((slotEl) => {
          const pos = slotEl.dataset.slot;
          const cardsEl = slotEl.querySelector(".cards");
          cardsEl.innerHTML = "";
          const bestIndex = twist.players[pos].reduce(
            (best, player, idx, players) =>
              scoreOf(player.stats) > scoreOf(players[best].stats) ? idx : best,
            0,
          );
          twist.players[pos].forEach((p, idx) => {
            const isPicked = picked[pos].includes(idx);
            const full = picked[pos].length >= twist.need[pos] && !isPicked;
            const div = document.createElement("div");
            div.className =
              "card" +
              (isPicked ? " picked" : "") +
              (full ? " disabled" : "") +
              (idx === bestIndex ? " best" : "");
            div.innerHTML = `<div class="best-badge">BEST AVAILABLE</div>
        <div class="pts">+${scoreOf(p.stats)}</div>
        <div class="name">${p.name}</div>
      <div class="team">${p.position ? `${p.position} · ` : ""}${p.team}</div>
        <div class="revealed-stats">${statLine(p.stats)}</div>`;
            div.onclick = () => {
              if (document.body.classList.contains("revealed")) return;
              if (isPicked) {
                picked[pos] = picked[pos].filter((i) => i !== idx);
              } else if (!full) {
                picked[pos].push(idx);
              }
              render();
            };
            cardsEl.appendChild(div);
          });
        });

        let totalPicks = 0;
        Object.keys(picked).forEach(
          (pos) => (totalPicks += picked[pos].length),
        );
        const totalNeeded = Object.values(twist.need).reduce(
          (a, b) => a + b,
          0,
        );
        document.getElementById("picksLabel").textContent =
          `${totalPicks} / ${totalNeeded} drafted`;
        document.getElementById("lockBtn").disabled =
          totalPicks !== totalNeeded;
      }

      function lockIn() {
        // Run a compatibility check before showing anything: confirm the twist's
        // data is still sound and every picked player actually scores a real number.
        const picksValid = Object.keys(picked).every((pos) =>
          picked[pos].every((idx) => {
            const p = twist.players[pos] && twist.players[pos][idx];
            if (!p) return false;
            const s = scoreOf(p.stats);
            return typeof s === "number" && Number.isFinite(s);
          }),
        );

        if (!twistIsValid(twist) || !picksValid) {
          document.getElementById("gradeText").textContent = "⚠";
          document.getElementById("scoreLine").textContent =
            "This twist's stat feed came back incomplete.";
          document.getElementById("verdictText").textContent =
            "Something in this challenge's data didn't check out cleanly, so the score can't be trusted. Hit \"New Twist\" for a clean one.";
          document.getElementById("result").classList.add("show");
          document
            .getElementById("result")
            .scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        document.body.classList.add("revealed");
        let totalPts = 0;
        Object.keys(picked).forEach((pos) => {
          picked[pos].forEach(
            (idx) => (totalPts += scoreOf(twist.players[pos][idx].stats)),
          );
        });
        totalPts = Math.round(totalPts * 10) / 10;

        const bestOf = (pos, n) => {
          const scored = twist.players[pos]
            .map((p) => scoreOf(p.stats))
            .sort((a, b) => b - a);
          return scored.slice(0, n).reduce((a, b) => a + b, 0);
        };
        const optimal =
          Math.round(
            Object.keys(twist.need).reduce(
              (sum, pos) => sum + bestOf(pos, twist.need[pos]),
              0,
            ) * 10,
          ) / 10;
        const pct = totalPts / optimal;

        let grade, verdict;
        if (pct >= 0.97) {
          grade = "S";
          verdict =
            "Optimal lineup. You knew exactly who balled out that season.";
        } else if (pct >= 0.88) {
          grade = "A";
          verdict =
            "Elite recall — you drafted the stat sheet, not the name value.";
        } else if (pct >= 0.75) {
          grade = "B";
          verdict =
            "Solid squad. A pick or two went off reputation instead of production.";
        } else if (pct >= 0.6) {
          grade = "C";
          verdict =
            "Middle of the pack — some name-brand picks underperformed the sleepers.";
        } else {
          grade = "D";
          verdict = "Rebuilding year. The box score disagreed with your gut.";
        }

        document.getElementById("gradeText").textContent = grade;
        document.getElementById("scoreLine").textContent =
          `YOUR SCORE: ${totalPts} PTS   ·   OPTIMAL POSSIBLE: ${optimal} PTS   ·   ${Math.round(pct * 100)}%`;
        document.getElementById("verdictText").textContent = verdict;
        document.getElementById("result").classList.add("show");
        document
          .getElementById("result")
          .scrollIntoView({ behavior: "smooth", block: "center" });
      }

      document.getElementById("rerollTop").onclick = startNewTwist;
      startNewTwist();
      loadStaticRosterTwists().catch((error) => {
        console.error("Could not load static challenge twists:", error);
      });
    </script>
  </body>
</html>
